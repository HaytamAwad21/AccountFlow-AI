<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AccountFlow AI — מערכת אוטומטית למעקב אחר מסמכים ותשלומי מס של לקוחות משרד רואי החשבון" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23ffb27a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230d1533'/%3E%3C/svg%3E" />
    <title>AccountFlow AI · ניהול מעקב לקוחות</title>
    <script>
      // Apply the saved light / dark theme before the first paint (no white flash). See src/lib/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("accountflow.theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
