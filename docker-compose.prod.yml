# Real office install: PostgreSQL + API + dashboard behind Caddy (automatic HTTPS) + nightly backups.
# Step by step: DEPLOY.md. In short, on the server:
#   bash deploy/setup.sh                                   # writes .env with fresh passwords
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from the internet (ports 80 and 443); the database and the API are not.
name: accountflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accountflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run deploy/setup.sh)}
      POSTGRES_DB: accountflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accountflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://accountflow:${POSTGRES_PASSWORD}@db:5432/accountflow
      SEED_ON_STARTUP: "false"   # a real office: no demo data; the first manager is created on the setup screen
      COOKIE_SECURE: "true"      # the session cookie travels over HTTPS only
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env (run deploy/setup.sh)}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: accountflow
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: accountflow
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TIMEZONE:-Asia/Jerusalem}
    volumes:
      - uploads:/uploads:ro
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh", "--loop"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
